<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Competidor - Envio de Fotos da Gincana</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen">

  <!-- Header -->
  <header class="bg-emerald-700 text-white shadow-md">
    <div class="max-w-3xl mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-xl font-bold flex items-center gap-2">
        <span>🏁</span> Área do Competidor
      </h1>
      <span class="text-xs bg-emerald-800 px-3 py-1 rounded-full text-emerald-100">Gincana IA</span>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 py-8 space-y-6">

    <!-- PASSO 1: IDENTIFICAÇÃO E ESCOLHA DA PROVA -->
    <section id="step-1" class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
      <div class="flex items-center gap-3 mb-6 pb-4 border-b border-slate-100">
        <span class="w-8 h-8 rounded-full bg-emerald-600 text-white font-bold flex items-center justify-center text-sm">1</span>
        <div>
          <h2 class="text-lg font-bold text-slate-900">Identificação do Competidor</h2>
          <p class="text-xs text-slate-500">Selecione a etapa e informe o número do seu veículo/equipe.</p>
        </div>
      </div>

      <form id="form-step-1" class="space-y-5">
        
        <!-- Seleção da Prova -->
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">Selecione a Prova / Etapa</label>
          <select id="select-prova" required class="w-full px-3 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none bg-white">
            <option value="" disabled selected>Carregando provas disponíveis...</option>
          </select>
        </div>

        <!-- Número do Carro / Competidor -->
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">Número do Carro / Equipe</label>
          <input type="number" id="numero-carro" min="1" required placeholder="Ex: 42" class="w-full px-3 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
        </div>

        <button type="submit" id="btn-iniciar" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 rounded-lg transition shadow-sm flex items-center justify-center gap-2">
          <span>Iniciar Envio das Fotos</span>
          <span>→</span>
        </button>
      </form>
    </section>

    <!-- PASSO 2: UPLOAD DAS FOTOS -->
    <section id="step-2" class="hidden space-y-6">
      
      <!-- Card Informativo -->
      <div class="bg-emerald-50 p-4 rounded-xl border border-emerald-200 flex justify-between items-center">
        <div>
          <span class="text-xs font-bold text-emerald-700 uppercase tracking-wider" id="info-carro">Carro #--</span>
          <h2 id="info-prova" class="text-lg font-bold text-slate-900">--</h2>
        </div>
        <button id="btn-trocar-prova" type="button" class="text-xs text-emerald-700 hover:underline font-semibold">
          Alterar dados
        </button>
      </div>

      <form id="form-step-2" class="space-y-6">
        
        <!-- Contêiner dinâmico gerado com base nas tarefas cadastradas -->
        <div id="container-tarefas" class="space-y-6"></div>

        <!-- Barra de Progresso / Envio -->
        <div id="status-container" class="hidden bg-slate-900 text-white p-4 rounded-xl shadow-md text-center space-y-2">
          <p id="status-texto" class="text-sm font-medium">Processando e enviando fotos...</p>
          <div class="w-full bg-slate-700 h-2 rounded-full overflow-hidden">
            <div id="status-barra" class="bg-emerald-500 h-full w-0 transition-all duration-300"></div>
          </div>
        </div>

        <!-- Botão de Envio Final -->
        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 flex justify-end">
          <button type="submit" id="btn-enviar-tudo" class="w-full md:w-auto px-8 py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-lg transition shadow-sm flex items-center justify-center gap-2">
            <span>🚀 Enviar Minhas Fotos para Avaliação</span>
          </button>
        </div>

      </form>
    </section>

  </main>

  <!-- Módulo Firebase JS (v10) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { initializeFirestore, collection, getDocs, addDoc, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBF-_Q5NJIhEjWhA-4kdffoWbGY5Z4jnxw",
      authDomain: "teste-2994e.firebaseapp.com",
      projectId: "teste-2994e",
      storageBucket: "teste-2994e.firebasestorage.app",
      messagingSenderId: "614899420753",
      appId: "1:614899420753:web:5fc23c3d0e8facdf593270"
    };

    const app = initializeApp(firebaseConfig);
    const db = initializeFirestore(app, {
      experimentalForceLongPolling: true
    });

    let provasCadastradas = [];
    let provaSelecionada = null;
    let numeroCarroGlobal = "";

    // Carregar provas do Firebase ao iniciar a página
    async function carregarProvas() {
      const select = document.getElementById('select-prova');
      select.innerHTML = '<option value="" disabled selected>Selecione uma prova...</option>';

      try {
        const q = query(collection(db, "provas"), orderBy("criado_em", "desc"));
        const snapshot = await getDocs(q);

        if (snapshot.empty) {
          select.innerHTML = '<option value="" disabled>Nenhuma prova cadastrada ainda</option>';
          return;
        }

        provasCadastradas = [];
        snapshot.forEach((doc) => {
          const data = doc.data();
          provasCadastradas.push({ id: doc.id, ...data });

          const option = document.createElement('option');
          option.value = doc.id;
          option.textContent = `${data.nome_prova} (${data.qtd_tarefas} ${data.qtd_tarefas === 1 ? 'foto' : 'fotos'})`;
          select.appendChild(option);
        });
      } catch (err) {
        console.error("Erro ao carregar provas:", err);
        select.innerHTML = '<option value="" disabled>Erro ao carregar provas</option>';
      }
    }

    carregarProvas();

    // Passo 1: Selecionar Prova + Número do Carro
    document.getElementById('form-step-1').addEventListener('submit', (e) => {
      e.preventDefault();
      const provaId = document.getElementById('select-prova').value;
      numeroCarroGlobal = document.getElementById('numero-carro').value;

      provaSelecionada = provasCadastradas.find(p => p.id === provaId);
      if (!provaSelecionada) return;

      document.getElementById('info-carro').textContent = `Carro / Equipe #${numeroCarroGlobal}`;
      document.getElementById('info-prova').textContent = provaSelecionada.nome_prova;

      gerarCamposDeEnvio(provaSelecionada.tarefas);

      document.getElementById('step-1').classList.add('hidden');
      document.getElementById('step-2').classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    // Botão para alterar prova/dados
    document.getElementById('btn-trocar-prova').addEventListener('click', () => {
      document.getElementById('step-2').classList.add('hidden');
      document.getElementById('step-1').classList.remove('hidden');
    });

    // Renderiza dynamicamente os campos para cada tarefa da prova (SEM mostrar número de pessoas ou pegadinhas)
    function gerarCamposDeEnvio(tarefas) {
      const container = document.getElementById('container-tarefas');
      container.innerHTML = '';

      tarefas.forEach((tarefa, index) => {
        const numTarefa = tarefa.ordem || (index + 1);
        const card = document.createElement('div');
        card.className = "bg-white p-6 rounded-xl shadow-sm border border-slate-200 space-y-4";

        card.innerHTML = `
          <div class="flex items-center justify-between pb-3 border-b border-slate-100">
            <h3 class="font-bold text-slate-800 text-lg flex items-center gap-2">
              <span class="bg-emerald-100 text-emerald-800 w-7 h-7 rounded-full flex items-center justify-center text-sm font-bold">${numTarefa}</span>
              Foto / Tarefa #${numTarefa}
            </h3>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-6 items-start">
            
            <!-- Foto de Referência (Gabarito da Admin) -->
            <div>
              <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Gabarito de Referência:</p>
              <img src="${tarefa.foto_gabarito_url}" class="h-44 w-full object-cover rounded-lg border border-slate-200 bg-slate-50" alt="Referência">
            </div>

            <!-- Upload da Foto Tirada pelo Competidor -->
            <div class="space-y-3">
              <label class="block text-sm font-semibold text-slate-700">Sua Foto Realizada</label>
              <input type="file" id="foto_competidor_${numTarefa}" required accept="image/*" class="w-full text-sm text-slate-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-lg file:border-0 file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100 cursor-pointer border rounded-lg p-1">
              
              <div id="preview-box-comp-${numTarefa}" class="hidden mt-2">
                <p class="text-xs text-slate-400 mb-1">Pré-visualização da sua foto:</p>
                <img id="preview-img-comp-${numTarefa}" src="" class="h-44 w-full object-cover rounded-lg border border-slate-200">
              </div>
            </div>

          </div>
        `;

        container.appendChild(card);

        // Preview da foto enviada pelo competidor
        const inputImg = document.getElementById(`foto_competidor_${numTarefa}`);
        inputImg.addEventListener('change', (e) => {
          const file = e.target.files[0];
          const previewBox = document.getElementById(`preview-box-comp-${numTarefa}`);
          const previewImg = document.getElementById(`preview-img-comp-${numTarefa}`);
          if (file) {
            previewImg.src = URL.createObjectURL(file);
            previewBox.classList.remove('hidden');
          }
        });
      });
    }

    // Otimizador de imagem client-side (Canvas -> Base64 JPEG)
    function otimizarImagemBase64(file, maxWidth = 1024, maxQuality = 0.75) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;

            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            
            resolve(canvas.toDataURL('image/jpeg', maxQuality));
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    // Envio Final das Fotos pelo Competidor
    document.getElementById('form-step-2').addEventListener('submit', async (e) => {
      e.preventDefault();

      const btnEnviar = document.getElementById('btn-enviar-tudo');
      const statusContainer = document.getElementById('status-container');
      const statusTexto = document.getElementById('status-texto');
      const statusBarra = document.getElementById('status-barra');

      btnEnviar.disabled = true;
      btnEnviar.classList.add('opacity-50', 'cursor-not-allowed');
      statusContainer.classList.remove('hidden');

      try {
        const respostasArr = [];
        const totalTarefas = provaSelecionada.tarefas.length;

        for (let i = 0; i < totalTarefas; i++) {
          const numTarefa = provaSelecionada.tarefas[i].ordem || (i + 1);
          
          statusTexto.textContent = `Otimizando sua foto ${i + 1} de ${totalTarefas}...`;
          statusBarra.style.width = `${Math.round(((i) / totalTarefas) * 80)}%`;

          const fileInput = document.getElementById(`foto_competidor_${numTarefa}`);
          const file = fileInput.files[0];

          const fotoBase64 = await otimizarImagemBase64(file);

          respostasArr.push({
            ordem: numTarefa,
            foto_competidor_url: fotoBase64,
            foto_gabarito_url: provaSelecionada.tarefas[i].foto_gabarito_url,
            regras: {
              qtd_competidores: provaSelecionada.tarefas[i].qtd_competidores,
              exigir_carro: provaSelecionada.tarefas[i].exigir_carro,
              pegadinhas: provaSelecionada.tarefas[i].pegadinhas || ""
            }
          });
        }

        statusTexto.textContent = "Salvando envio no banco de dados...";
        statusBarra.style.width = "90%";

        // Salva na coleção 'envios_competidores'
        await addDoc(collection(db, "envios_competidores"), {
          prova_id: provaSelecionada.id,
          nome_prova: provaSelecionada.nome_prova,
          numero_carro: numeroCarroGlobal,
          respostas: respostasArr,
          status_avaliacao: "pendente",
          enviado_em: serverTimestamp()
        });

        statusBarra.style.width = "100%";
        statusTexto.textContent = "✅ Fotos enviadas com sucesso!";

        setTimeout(() => {
          alert("Suas fotos foram salvas com sucesso e enviadas para avaliação!");
          location.reload();
        }, 1200);

      } catch (error) {
        console.error("Erro ao enviar respostas:", error);
        alert("Erro ao enviar fotos: " + error.message);
        btnEnviar.disabled = false;
        btnEnviar.classList.remove('opacity-50', 'cursor-not-allowed');
        statusContainer.classList.add('hidden');
      }
    });
  </script>
</body>
</html>
