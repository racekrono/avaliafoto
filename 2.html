<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Competidor - Envio de Fotos da Gincana</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen">
  <header class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex justify-between items-center sticky top-0 z-50">
    <div class="flex items-center gap-3">
      <span class="text-2xl">📸</span>
      <div>
        <h1 class="text-lg font-bold text-white">Portal do Competidor - Envio de Tarefas</h1>
        <p class="text-xs text-slate-400">Submeta as fotografias da sua equipa para auditoria.</p>
      </div>
    </div>
  </header>

  <main class="max-w-3xl mx-auto p-4 md:p-6 space-y-6">
    <div class="bg-slate-800 rounded-xl border border-slate-700 p-6 space-y-4">
      <h2 class="text-xl font-black text-white">Identificação da Equipa</h2>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-bold text-slate-400 mb-1">Selecione a Prova</label>
          <select id="select-prova" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-white focus:outline-none focus:border-indigo-500">
            <option value="">A carregar provas...</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-400 mb-1">Número do Carro / Equipa</label>
          <input type="number" id="input-numero-carro" placeholder="Ex: 42" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-white focus:outline-none focus:border-indigo-500">
        </div>
      </div>
    </div>

    <div id="container-tarefas-envio" class="space-y-4">
      <!-- Tarefas carregadas dinamicamente com base na prova selecionada -->
      <p class="text-xs text-slate-500 text-center py-4">Selecione uma prova para exibir as tarefas.</p>
    </div>

    <button id="btn-enviar-todas" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold p-4 rounded-xl shadow-lg transition hidden">🚀 Submeter Fotos para Avaliação</button>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { initializeFirestore, collection, getDocs, doc, getDoc, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBF-_Q5NJIhEjWhA-4kdffoWbGY5Z4jnxw",
      authDomain: "teste-2994e.firebaseapp.com",
      projectId: "teste-2994e",
      storageBucket: "teste-2994e.firebasestorage.app",
      messagingSenderId: "614899420753",
      appId: "1:614899420753:web:5fc23c3d0e8facdf593270"
    };

    const app = initializeApp(firebaseConfig);
    const db = initializeFirestore(app, { experimentalForceLongPolling: true });

    let provaSelecionadaDados = null;

    async function carregarProvas() {
      const select = document.getElementById('select-prova');
      try {
        const snapshot = await getDocs(collection(db, "provas"));
        select.innerHTML = '<option value="">Selecione uma prova...</option>';
        snapshot.forEach(docSnap => {
          const data = docSnap.data();
          const opt = document.createElement('option');
          opt.value = docSnap.id;
          opt.textContent = data.nome_prova;
          select.appendChild(opt);
        });
      } catch (err) {
        select.innerHTML = '<option value="">Erro ao carregar provas</option>';
      }
    }

    document.getElementById('select-prova').addEventListener('change', async (e) => {
      const provaId = e.target.value;
      const container = document.getElementById('container-tarefas-envio');
      const btnEnviar = document.getElementById('btn-enviar-todas');

      if (!provaId) {
        container.innerHTML = '<p class="text-xs text-slate-500 text-center py-4">Selecione uma prova para exibir as tarefas.</p>';
        btnEnviar.classList.add('hidden');
        return;
      }

      container.innerHTML = '<p class="text-xs text-slate-400 text-center py-4">A carregar tarefas...</p>';
      try {
        const snap = await getDoc(doc(db, "provas", provaId));
        if (snap.exists()) {
          provaSelecionadaDados = snap.data();
          renderizarCamposTarefas(provaSelecionadaDados.tarefas || []);
          btnEnviar.classList.remove('hidden');
        }
      } catch (err) {
        container.innerHTML = '<p class="text-xs text-rose-400 text-center py-4">Erro ao carregar detalhes da prova.</p>';
      }
    });

    function renderizarCamposTarefas(tarefas) {
      const container = document.getElementById('container-tarefas-envio');
      container.innerHTML = '';
      tarefas.forEach((tarefa, idx) => {
        const card = document.createElement('div');
        card.className = "bg-slate-800 rounded-xl border border-slate-700 p-5 space-y-3 tarefa-envio-card";
        card.dataset.ordem = tarefa.ordem || (idx + 1);
        card.dataset.gabarito = tarefa.foto_gabarito_url;
        card.innerHTML = `
          <div class="flex justify-between items-center">
            <h3 class="font-bold text-white text-sm">Tarefa #${tarefa.ordem || (idx + 1)}</h3>
            <span class="text-xs bg-slate-900 text-emerald-400 px-2 py-0.5 rounded-full font-bold">${tarefa.pontos} PTS</span>
          </div>
          <div class="flex items-center gap-4 bg-slate-900/50 p-3 rounded-lg">
            <img src="${tarefa.foto_gabarito_url}" class="w-20 h-20 object-cover rounded border border-slate-700">
            <div class="text-xs text-slate-300 space-y-1">
              <span class="font-bold text-indigo-400 block">Referência / Gabarito</span>
              <p>Qtd Pessoas: ${tarefa.regras?.qtd_competidores || 1}</p>
              <p>Exige Carro: ${tarefa.regras?.exigir_carro ? 'Sim' : 'Não'}</p>
            </div>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-400 mb-1">URL da Foto tirada pela Equipa</label>
            <input type="text" class="input-foto-competidor w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white" placeholder="Cole aqui o link direto da imagem tirada">
          </div>
        `;
        container.appendChild(card);
      });
    }

    document.getElementById('btn-enviar-todas').addEventListener('click', async () => {
      const selectProva = document.getElementById('select-prova');
      const numeroCarro = document.getElementById('input-numero-carro').value.trim();

      if (!selectProva.value || !numeroCarro) {
        alert("Selecione a prova e preencha o número do carro!");
        return;
      }

      const cards = document.querySelectorAll('.tarefa-envio-card');
      const respostas = [];

      cards.forEach(card => {
        respostas.push({
          ordem: parseInt(card.dataset.ordem),
          foto_gabarito_url: card.dataset.gabarito,
          foto_competidor_url: card.querySelector('.input-foto-competidor').value.trim()
        });
      });

      try {
        await addDoc(collection(db, "envios_competidores"), {
          prova_id: selectProva.value,
          nome_prova: selectProva.options[selectProva.selectedIndex].text,
          numero_carro: parseInt(numeroCarro),
          respostas: respostas,
          status_avaliacao: "pendente",
          enviado_em: new Date().toISOString()
        });
        alert("Envio efetuado com sucesso! Aguarde a avaliação.");
        window.location.reload();
      } catch (err) {
        alert("Erro ao enviar: " + err.message);
      }
    });

    carregarProvas();
  </script>
</body>
</html>
