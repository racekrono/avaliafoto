<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Criar Prova / Gincana</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen">
  <header class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex justify-between items-center sticky top-0 z-50">
    <div class="flex items-center gap-3">
      <span class="text-2xl">🛠️</span>
      <div>
        <h1 class="text-lg font-bold text-white">Painel do Administrador - Criar Prova</h1>
        <p class="text-xs text-slate-400">Configure as tarefas e os gabaritos para a avaliação por IA.</p>
      </div>
    </div>
    <div class="flex gap-2">
      <button onclick="window.location.href='avaliacao_piloto.html'" class="bg-slate-700 hover:bg-slate-600 text-xs px-3 py-2 rounded-lg">⚖️ Painel do Juiz</button>
      <button onclick="window.location.href='avaliacao_auto.html'" class="bg-slate-700 hover:bg-slate-600 text-xs px-3 py-2 rounded-lg">⚡ Auto IA</button>
    </div>
  </header>

  <main class="max-w-4xl mx-auto p-4 md:p-6 space-y-6">
    <div class="bg-slate-800 rounded-xl border border-slate-700 p-6 space-y-4">
      <h2 class="text-xl font-black text-white">Criar Nova Prova / Gincana</h2>
      <div>
        <label class="block text-xs font-bold text-slate-400 mb-1">Nome da Prova / Gincana</label>
        <input type="text" id="nome-prova" placeholder="Ex: Rally 4x4 Etapa Paulo Afonso" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-white focus:outline-none focus:border-indigo-500">
      </div>
    </div>

    <div class="bg-slate-800 rounded-xl border border-slate-700 p-6 space-y-4">
      <div class="flex justify-between items-center">
        <h3 class="text-lg font-bold text-white">Tarefas da Prova</h3>
        <button id="btn-adicionar-tarefa" class="bg-indigo-600 hover:bg-indigo-500 text-xs font-bold px-4 py-2 rounded-lg transition">➕ Adicionar Tarefa</button>
      </div>
      <div id="container-tarefas" class="space-y-4">
        <!-- As tarefas dinamicas entram aqui -->
      </div>
    </div>

    <button id="btn-salvar-prova" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold p-4 rounded-xl shadow-lg transition">💾 Guardar e Publicar Prova</button>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { initializeFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBF-_Q5NJIhEjWhA-4kdffoWbGY5Z4jnxw",
      authDomain: "teste-2994e.firebaseapp.com",
      projectId: "teste-2994e",
      storageBucket: "teste-2994e.firebasestorage.app",
      messagingSenderId: "614899420753",
      appId: "1:614899420753:web:5fc23c3d0e8facdf593270"
    };

    const app = initializeApp(firebaseConfig);
    const db = initializeFirestore(app, { experimentalForceLongPolling: true });

    let contadorTarefas = 0;

    function adicionarCardTarefa() {
      contadorTarefas++;
      const container = document.getElementById('container-tarefas');
      const div = document.createElement('div');
      div.className = "bg-slate-900 p-4 rounded-xl border border-slate-700 space-y-3 tarefa-item";
      div.dataset.index = contadorTarefas;
      div.innerHTML = `
        <div class="flex justify-between items-center">
          <span class="text-xs font-bold text-indigo-400">Tarefa #${contadorTarefas}</span>
          <button type="button" onclick="this.closest('.tarefa-item').remove()" class="text-xs text-rose-400 hover:underline">Remover</button>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs text-slate-400 mb-1">URL da Foto de Gabarito (Referência)</label>
            <input type="text" class="input-gabarito w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-xs text-white" placeholder="https://exemplo.com/foto.jpg">
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">Valor em Pontos</label>
            <input type="number" class="input-pontos w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-xs text-white" value="100">
          </div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-3 pt-2">
          <div>
            <label class="block text-xs text-slate-400 mb-1">Qtd Pessoas Exigidas</label>
            <input type="number" class="input-qtd w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-xs text-white" value="1">
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">Exigir Carro na Foto?</label>
            <select class="input-carro w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-xs text-white">
              <option value="true">Sim</option>
              <option value="false">Não</option>
            </select>
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">Observações / Pegadinhas</label>
            <input type="text" class="input-pegadinha w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-xs text-white" placeholder="Ex: Todos devem usar capacete">
          </div>
        </div>
      `;
      container.appendChild(div);
    }

    document.getElementById('btn-adicionar-tarefa').addEventListener('click', adicionarCardTarefa);
    adicionarCardTarefa(); // Adiciona uma por padrão

    document.getElementById('btn-salvar-prova').addEventListener('click', async () => {
      const nomeProva = document.getElementById('nome-prova').value.trim();
      if (!nomeProva) {
        alert("Insira o nome da prova!");
        return;
      }

      const itensTarefas = document.querySelectorAll('.tarefa-item');
      const tarefas = [];

      itensTarefas.forEach((el, idx) => {
        tarefas.push({
          ordem: idx + 1,
          foto_gabarito_url: el.querySelector('.input-gabarito').value.trim(),
          pontos: parseInt(el.querySelector('.input-pontos').value) || 100,
          regras: {
            qtd_competidores: parseInt(el.querySelector('.input-qtd').value) || 1,
            exigir_carro: el.querySelector('.input-carro').value === 'true',
            pegadinhas: el.querySelector('.input-pegadinha').value.trim()
          }
        });
      });

      try {
        await addDoc(collection(db, "provas"), {
          nome_prova: nomeProva,
          tarefas: tarefas,
          criado_em: new Date().toISOString()
        });
        alert("Prova criada e publicada com sucesso!");
        window.location.href = 'avaliacao_piloto.html';
      } catch (err) {
        alert("Erro ao guardar prova: " + err.message);
      }
    });
  </script>
</body>
</html>
